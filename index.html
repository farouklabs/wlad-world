<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>WLAD.WORLD</title>

  <style>
    :root{
      --paper:#f4f1e9;
      --ink:#171717;
      --red:#b00000;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--paper);
      color:var(--ink);
    }

    body{
      min-height:100svh;
      overflow:hidden;
      font-family:"Courier New",Courier,monospace;
      -webkit-font-smoothing:antialiased;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:20;
      opacity:.13;
      background:repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,.025) 0,
        rgba(0,0,0,.025) 1px,
        transparent 1px,
        transparent 4px
      );
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:19;
      opacity:.09;
      background-image:radial-gradient(rgba(0,0,0,.16) .5px,transparent .65px);
      background-size:5px 5px;
    }

    main{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:32px;
    }

    .terminal{
      width:min(760px,100%);
      font-size:clamp(13px,1.2vw,17px);
      line-height:1.55;
      letter-spacing:.025em;
    }

    .brand{
      margin:0 0 2rem;
      color:var(--red);
      font-weight:700;
      letter-spacing:.10em;
    }

    .line{
      margin:0;
      min-height:1.55em;
    }

    .loader-wrap{
      display:flex;
      align-items:baseline;
      gap:.7rem;
      white-space:nowrap;
      margin-top:.05rem;
    }

    .bar{
      display:inline-block;
      width:20ch;
      max-width:55vw;
      overflow:hidden;
      letter-spacing:0;
      color:var(--red);
    }

    .percent{
      display:inline-block;
      min-width:4ch;
      text-align:right;
    }

    .after-load{
      opacity:0;
      transform:translateY(3px);
      transition:opacity .2s linear,transform .2s linear;
    }

    .after-load.visible{
      opacity:1;
      transform:none;
    }

    .meta,.welcome{
      margin-top:2rem;
    }

    .enter{
      appearance:none;
      border:0;
      background:none;
      color:var(--ink);
      padding:0;
      margin-top:1.65rem;
      font:inherit;
      font-weight:700;
      letter-spacing:.07em;
      cursor:pointer;
    }

    .enter:hover,
    .enter:focus-visible{
      color:var(--red);
      text-decoration:underline;
      text-underline-offset:4px;
    }

    /* Medium, straight WLAD logo placed under each action */
    .logo-row{
      margin-top:1.55rem;
      width:100%;
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
    }

    .wlad-logo{
      display:block;
      width:82px;
      height:auto;
      opacity:.98;
    }

    .screen{
      transition:opacity .16s linear,filter .16s linear;
    }

    .screen.exit{
      opacity:0;
      filter:blur(2px);
    }

    #second-screen{
      display:none;
    }

    #second-screen.active{
      display:block;
      animation:arrive .28s linear both;
    }

    .soon{
      margin-top:3.2rem;
    }

    .soon h1{
      margin:0 0 1rem;
      font:inherit;
      font-weight:700;
      letter-spacing:.045em;
    }

    .soon p{
      margin:.3rem 0;
    }

    .tagline{
      margin-top:2.4rem!important;
    }

    .notify{
      display:inline-block;
      margin-top:1.8rem;
      color:var(--ink);
      font-weight:700;
      letter-spacing:.06em;
      text-decoration:none;
    }

    .notify:hover,
    .notify:focus-visible{
      color:var(--red);
      text-decoration:underline;
      text-underline-offset:4px;
    }

    .glitch{
      animation:glitch .16s linear 1;
    }

    @keyframes glitch{
      0%{transform:none}
      25%{transform:translate(-3px,1px)}
      50%{transform:translate(3px,-1px)}
      75%{transform:translate(-1px,0)}
      100%{transform:none}
    }

    @keyframes arrive{
      0%{opacity:0;transform:translateX(-2px)}
      35%{opacity:.65;transform:translateX(2px)}
      100%{opacity:1;transform:none}
    }

    @media(max-width:700px){
      main{
        place-items:start;
        padding:12svh 24px 24px;
      }

      .terminal{
        font-size:12px;
        line-height:1.6;
      }

      .brand{
        margin-bottom:1.7rem;
      }

      .meta,.welcome{
        margin-top:1.7rem;
      }

      .wlad-logo{
        width:74px;
      }

      .logo-row{
        margin-top:1.35rem;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="terminal" aria-live="polite">

      <div id="first-screen" class="screen">
        <p class="brand">WLAD.WORLD © 2026</p>

        <p class="line">SYSTEM INITIALIZING...</p>
        <p class="line">LOADING WLAD.WORLD</p>

        <div class="loader-wrap">
          <span id="bar" class="bar">░░░░░░░░░░░░░░░░░░░░</span>
          <span id="percent" class="percent">0%</span>
        </div>

        <div id="after-load" class="after-load">
          <div class="meta">
            <p class="line">&gt; LOCATION: <span id="location">UNKNOWN</span></p>
            <p class="line">&gt; STATUS: AMONG DEMONS</p>
          </div>

          <div class="welcome">
            <p class="line"><strong>WELCOME TO WLAD.WORLD</strong></p>
            <p class="line">WE LIVE AMONG DEMONS.</p>
          </div>

          <button id="enter" class="enter" type="button">[ ENTER ]</button>

          <div class="logo-row">
            <img class="wlad-logo" src="logo-distressed.png" alt="WLAD">
          </div>
        </div>
      </div>

      <div id="second-screen" class="screen">
        <p class="brand">WLAD.WORLD / 2026</p>

        <div class="soon">
          <h1>THE WORLD ISN'T READY YET.</h1>
          <p>COMING SOON.</p>

          <p class="tagline">WE LIVE AMONG DEMONS™</p>

          <a id="notify" class="notify" href="#">[ GET NOTIFIED ]</a>

          <div class="logo-row">
            <img class="wlad-logo" src="logo-distressed.png" alt="WLAD">
          </div>
        </div>
      </div>

    </section>
  </main>

  <script>
    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const afterLoad = document.getElementById("after-load");
    const locationEl = document.getElementById("location");
    const enter = document.getElementById("enter");
    const firstScreen = document.getElementById("first-screen");
    const secondScreen = document.getElementById("second-screen");
    const notify = document.getElementById("notify");

    const BAR_LENGTH = 20;
    const LOAD_TIME = 3800;

    function drawBar(progress){
      const filled = Math.round((progress / 100) * BAR_LENGTH);

      bar.textContent =
        "█".repeat(filled) +
        "░".repeat(BAR_LENGTH - filled);

      percent.textContent = progress + "%";
    }

    function startLoader(){
      const started = performance.now();

      function frame(now){
        const raw = Math.min((now - started) / LOAD_TIME, 1);
        let progress = Math.floor((1 - Math.pow(1 - raw, 2.2)) * 100);

        progress = raw < 1 ? Math.min(progress,99) : 100;

        drawBar(progress);

        if(raw < 1){
          requestAnimationFrame(frame);
        }else{
          finishLoading();
        }
      }

      requestAnimationFrame(frame);
    }

    async function getApproximateLocation(){
      try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(),1800);

        const response = await fetch("https://ipwho.is/",{
          signal:controller.signal,
          cache:"no-store"
        });

        clearTimeout(timeout);

        if(!response.ok) throw new Error();

        const data = await response.json();

        if(!data.success) throw new Error();

        const city = (data.city || "").trim();
        const country = (data.country || "").trim();

        if(city && country){
          return `${city.toUpperCase()}, ${country.toUpperCase()}`;
        }

        if(country){
          return country.toUpperCase();
        }

      }catch(error){}

      return "UNKNOWN";
    }

    async function finishLoading(){
      drawBar(100);

      locationEl.textContent = await getApproximateLocation();

      afterLoad.classList.add("visible");
    }

    enter.addEventListener("click",()=>{
      firstScreen.classList.add("glitch");

      setTimeout(()=>{
        firstScreen.classList.add("exit");
      },90);

      setTimeout(()=>{
        firstScreen.style.display="none";
        secondScreen.classList.add("active");
      },250);
    });

    notify.addEventListener("click",event=>{
      if(notify.getAttribute("href")==="#"){
        event.preventDefault();
      }
    });

    startLoader();
  </script>
</body>
</html>
